name: Manutenção LEGADO FC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manutencao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check extension.js
          node --check extension-v08.js
          node --check extension-v10.js
          node --check mobile.js
