name: Importar LEGADO FC atual

on:
  push:
    paths:
      - '.github/workflows/import-legado.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importar arquivos do jogo publicado
        shell: bash
        run: |
          set -e
          files=(index.html style.css extension.css mobile.css app.js extension.js extension-v08.js extension-v10.js mobile.js universe.js manifest.webmanifest sw.js netlify.toml README.txt)
          for f in "${files[@]}"; do
            curl -fsSL "https://jogolegace.netlify.app/$f" -o "$f"
          done
          mkdir -p data icons
          curl -fsSL "https://jogolegace.netlify.app/data/game-data.js" -o data/game-data.js
          curl -fsSL "https://jogolegace.netlify.app/icons/icon.svg" -o icons/icon.svg || true
          curl -fsSL "https://jogolegace.netlify.app/icons/icon-192.png" -o icons/icon-192.png || true
          curl -fsSL "https://jogolegace.netlify.app/icons/icon-512.png" -o icons/icon-512.png || true
      - name: Salvar código no GitHub
        run: |
          git config user.name "LEGADO FC Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Importa versão atual do LEGADO FC" || exit 0
          git push
